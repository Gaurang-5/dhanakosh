name: Release
on:
  push:
    tags:
      - "v*"
  # Manual runs build, sign, notarize, and test without publishing.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify release versions
        shell: bash
        run: |
          set -euo pipefail
          app_version=$(node -p "require('./apps/tauri/tauri.conf.json').version")
          package_version=$(node -p "require('./package.json').version")
          workspace_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)

          test "$app_version" = "$package_version"
          test "$app_version" = "$workspace_version"

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$GITHUB_REF_NAME" = "v$app_version"
          fi

  release:
    needs: validate-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            cache-key: macos-x86_64
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            cache-key: macos-aarch64
          - platform: "windows-latest"
            args: "--target x86_64-pc-windows-msvc"
            cache-key: windows-x86_64
          - platform: "windows-latest"
            args: "--target aarch64-pc-windows-msvc"
            cache-key: windows-aarch64
          - platform: "ubuntu-24.04"
            args: ""
            cache-key: linux-x86_64

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install dependencies (ubuntu only)
        if: contains(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf pkg-config libssl-dev libsoup2.4-dev javascriptcoregtk-4.0 webkit2gtk-4.0 xdg-utils

      - name: Verify vendored OpenSSL Perl prerequisite
        shell: bash
        run: perl -v

      - name: Rust setup
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets:
            ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' ||
            '' }}

      - name: Install macOS Rust targets
        if: contains(matrix.platform, 'macos')
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: pnpm Setup
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Must match cache-warm.yml: tag refs can only restore caches created
          # on the default branch, and caches saved on a tag are unreachable
          # from other tags - so warming happens on main, saving here is wasted.
          shared-key: release-${{ matrix.cache-key }}
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Sync node version and setup cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: "pnpm" # Set this to npm, yarn or pnpm.

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust targets
        if: matrix.platform == 'windows-latest'
        run: rustup target add aarch64-pc-windows-msvc x86_64-pc-windows-msvc

      - name: Determine Windows bundle targets
        if: contains(matrix.platform, 'windows')
        id: win-bundles
        shell: bash
        run: |
          # If version has a non-numeric pre-release (e.g. beta), skip MSI (WiX requires numeric-only)
          ARGS=$(node -e "
            const v = require('./apps/tauri/tauri.conf.json').version;
            console.log(/\-.*[a-zA-Z]/.test(v) ? '--bundles nsis' : '');
          ")
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Require Apple release credentials
        if: contains(matrix.platform, 'macos')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_API_ISSUER \
            APPLE_API_KEY \
            APPLE_API_KEY_P8 \
            APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub secret: $name"
              exit 1
            fi
          done

      - name: Materialize App Store Connect API key
        if: contains(matrix.platform, 'macos')
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/asc.p8"

      - name: Check Connect build configuration
        env:
          CONNECT_AUTH_URL: ${{ vars.CONNECT_AUTH_URL }}
          CONNECT_AUTH_PUBLISHABLE_KEY: ${{ vars.CONNECT_AUTH_PUBLISHABLE_KEY }}
          CONNECT_STORAGE_ALLOWED_HOSTS: ${{ secrets.CONNECT_STORAGE_ALLOWED_HOSTS }}
        run:
          ${{ runner.os == 'Windows' && 'python' || 'python3' }}
          .github/scripts/check_connect_build.py --github-env

      - name: Build the app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/asc.p8
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          releaseName: ${{ github.event_name == 'push' && 'Dhanakosh v__VERSION__' || '' }}
          releaseBody:
            "See the assets below to download and install Dhanakosh for your operating system."
          # Keep the release private until every advertised platform succeeds.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} ${{ steps.win-bundles.outputs.args }} -- --locked

      - name: Verify macOS signatures and notarization
        if: contains(matrix.platform, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          app_bundles=(target/*/release/bundle/macos/*.app target/release/bundle/macos/*.app)
          disk_images=(target/*/release/bundle/dmg/*.dmg target/release/bundle/dmg/*.dmg)

          if [ "${#app_bundles[@]}" -eq 0 ]; then
            echo "::error::No macOS app bundle was produced"
            exit 1
          fi
          if [ "${#disk_images[@]}" -eq 0 ]; then
            echo "::error::No macOS disk image was produced"
            exit 1
          fi

          for app in "${app_bundles[@]}"; do
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose=4 "$app"
          done

          for dmg in "${disk_images[@]}"; do
            xcrun stapler validate "$dmg"
            spctl --assess --type open \
              --context context:primary-signature \
              --verbose=4 "$dmg"
          done

      - name: Upload validation packages
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dhanakosh-${{ matrix.cache-key }}-${{ github.sha }}
          path: |
            target/**/release/bundle/**/*.dmg
            target/**/release/bundle/**/*.exe
            target/**/release/bundle/**/*.msi
            target/**/release/bundle/**/*.deb
            target/**/release/bundle/**/*.rpm
            target/**/release/bundle/**/*.AppImage
            target/**/release/bundle/**/*.tar.gz
            target/**/release/bundle/**/*.zip
            target/**/release/bundle/**/*.sig
          if-no-files-found: error
          retention-days: 7

  publish-release:
    if: github.event_name == 'push'
    needs: [validate-release, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Verify required desktop assets
        shell: bash
        run: |
          set -euo pipefail
          assets=$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name')

          require_asset() {
            pattern=$1
            if ! grep -Eq "$pattern" <<<"$assets"; then
              echo "Missing release asset matching: $pattern" >&2
              exit 1
            fi
          }

          require_asset '^Dhanakosh_.*_x64-setup\.exe$'
          require_asset '^Dhanakosh_.*_arm64-setup\.exe$'
          require_asset '^Dhanakosh_.*_x64\.dmg$'
          require_asset '^Dhanakosh_.*_aarch64\.dmg$'
          require_asset '^Dhanakosh_.*_amd64\.AppImage$'
          require_asset '^Dhanakosh_.*_amd64\.deb$'

      - name: Publish verified release
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
